appId: com.binagames.romvault
productName: RomVault
directories:
  output: release
  buildResources: build
files:
  - out/**
  - locales/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: RomVault-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: RomVault
# Mises à jour automatiques : releases GitHub (owner/repo à renseigner avant la 1re publication).
publish:
  provider: github
  owner: Cantogrel
  repo: romvault
  releaseType: release
