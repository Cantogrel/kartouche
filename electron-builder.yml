# appId conservé volontairement (identifiant d'installation NSIS) : une mise à jour depuis RomVault 0.2.x se fait sur place et retrouve data/. Voir docs/rename-kartouche.md.
appId: com.binagames.romvault
productName: Kartouche
directories:
  output: release
  buildResources: build
files:
  - out/**
  - locales/**
  - build/icon.png
  - package.json
asar: true
# 7-Zip (WebAssembly, LGPL-2.1+ avec restriction unRAR) : fichiers réels et remplaçables, hors de l'asar — voir src/main/library/archive.ts.
asarUnpack:
  - node_modules/7z-wasm/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Kartouche-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
  shortcutName: Kartouche
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
# Mises à jour automatiques : releases GitHub. L'ancienne URL Cantogrel/romvault redirige vers ce dépôt (les installations 0.2.x s'y mettent à jour).
publish:
  provider: github
  owner: Cantogrel
  repo: kartouche
  releaseType: release
