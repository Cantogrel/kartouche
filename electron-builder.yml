appId: com.binagames.romvault
productName: RomVault
directories:
  output: release
  buildResources: build
files:
  - out/**
  - locales/**
  - build/icon.png
  - package.json
asar: true
# 7-Zip (WebAssembly, LGPL-2.1+ avec restriction unRAR) : fichiers réels et remplaçables, hors de l'asar — voir src/main/library/archive.ts.
asarUnpack:
  - node_modules/7z-wasm/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: RomVault-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
  shortcutName: RomVault
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
# Mises à jour automatiques : releases GitHub (owner/repo à renseigner avant la 1re publication).
publish:
  provider: github
  owner: Cantogrel
  repo: romvault
  releaseType: release
